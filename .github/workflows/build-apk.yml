name: Build APK Gigi Sehat

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Tombol manual di GitHub

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🗂️ Buat folder assets/images
        run: mkdir -p assets/images

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Build APK Release
        run: flutter build apk --release

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gigi-sehat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
